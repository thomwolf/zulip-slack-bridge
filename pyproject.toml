[project]
name = "zulip-slack-bridge"
version = "0.1.0"
description = "An experimental, bot-only bridge for one Slack and Zulip channel pair"
requires-python = ">=3.12"
dependencies = ["slack-sdk>=3.33,<4", "zulip>=0.9,<1", "requests>=2.32,<3", "markdown-it-py>=3,<5"]

[project.scripts]
chat-bridge = "chat_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_bridge"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9", "pyright>=1.1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
